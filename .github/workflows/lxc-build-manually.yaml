name: Create and publish the Standalone LXC image

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'build manually trigger'
        required: true
        default: 'triggered by developer'
      blockchain:
        description: 'Blockchain'
        required: true
        default: 'base'
      tag:
        description: 'Git tag/branch to checkout code from (if not specified, use selected branch)'
        required: false
      image_tag:
        description: 'Tag name for the built image (if not specified, use git hash for branch or tag name for git tag)'
        required: false
      latest:
        description: 'Tag the image as latest for the selected blockchain'
        required: false
        type: boolean
        default: false

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      BLOCKCHAIN: ${{ inputs.blockchain || 'base' }}

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 35840
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - name: Set the config files
        run: bash build/set-config-files.sh "$BLOCKCHAIN"

      - name: Update LXC YAML with dynamic values
        id: update-yaml
        run: |
          # Get commit hash for version
          SHA_SHORT=$(git rev-parse --short HEAD)

          # Determine code version for internal use
          if [[ -n "${{ inputs.tag }}" ]]; then
            # Use specified tag as internal version
            VERSION="${{ inputs.tag }}"
          else
            # Use git hash for internal version
            VERSION="${SHA_SHORT}"
          fi

          # Determine image tag for naming
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            # Use specified image tag
            IMAGE_TAG="${{ inputs.image_tag }}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            # Use code tag as image tag
            IMAGE_TAG="${{ inputs.tag }}"
          else
            # Use git hash as image tag
            IMAGE_TAG="${SHA_SHORT}"
          fi

          echo "Using code version: ${VERSION}"
          echo "Using image tag: ${IMAGE_TAG}"
          echo "Using blockchain: ${BLOCKCHAIN}"

          # Export for later steps
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          # Create a full version that includes blockchain for file naming
          FULL_VERSION="${IMAGE_TAG}-${BLOCKCHAIN}"
          echo "full_version=${FULL_VERSION}" >> $GITHUB_OUTPUT

          # Replace placeholders in LXC YAML
          sed -i "s/RELEASE_VERSION/${IMAGE_TAG}/g" build/lxc/crynux-node.lxc.yaml
          sed -i "s/BLOCKCHAIN_NAME/${BLOCKCHAIN}/g" build/lxc/crynux-node.lxc.yaml

          echo "Updated LXC YAML file:"
          cat build/lxc/crynux-node.lxc.yaml

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap gpg rsync squashfs-tools

      - name: Install distrobuilder via Snap
        run: |
          # Per official documentation, snap is the recommended way to install distrobuilder.
          # We rely on the snap to be self-contained with its core dependencies.
          sudo snap install distrobuilder --classic

      - name: Configure LXC build storage
        run: |
          set -eux
          LXC_BUILD_DIR="${GITHUB_WORKSPACE}/.lxc-build"
          LXC_SOURCE_DIR="${LXC_BUILD_DIR}/source"
          echo "LXC_BUILD_DIR=${LXC_BUILD_DIR}" >> "${GITHUB_ENV}"
          echo "LXC_SOURCE_DIR=${LXC_SOURCE_DIR}" >> "${GITHUB_ENV}"
          rm -rf "${LXC_SOURCE_DIR}" "${LXC_BUILD_DIR}/cache" "${LXC_BUILD_DIR}/output"
          mkdir -p "${LXC_BUILD_DIR}/cache"
          mkdir -p "${LXC_BUILD_DIR}/sources"
          mkdir -p "${LXC_BUILD_DIR}/output"
          mkdir -p "${LXC_SOURCE_DIR}"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.lxc-build/' \
            ./ "${LXC_SOURCE_DIR}/"
          sed -i "s|LXC_SOURCE_DIR|${LXC_SOURCE_DIR}|g" build/lxc/crynux-node.lxc.yaml

      - name: Build Incus image with distrobuilder
        run: |
          # The snap installation places distrobuilder directly in the PATH.
          # Use build-incus to generate Incus format images
          sudo -E distrobuilder build-incus build/lxc/crynux-node.lxc.yaml "${LXC_BUILD_DIR}/output" \
            --cache-dir "${LXC_BUILD_DIR}/cache" \
            --sources-dir "${LXC_BUILD_DIR}/sources" \
            --keep-sources=false \
            -o image.architecture=$(dpkg --print-architecture)

      - name: List generated files
        run: |
          echo "Files generated by distrobuilder:"
          ls -la "${LXC_BUILD_DIR}/output"
          echo "Checking for Incus image format files:"
          find "${LXC_BUILD_DIR}/output" -name "incus.tar.xz" -o -name "rootfs.squashfs" | head -10

      - name: Rename artifacts with version
        run: |
          FULL_VERSION="${{ steps.update-yaml.outputs.full_version }}"
          sudo mv "${LXC_BUILD_DIR}/output/incus.tar.xz" "incus-${FULL_VERSION}.tar.xz"
          sudo mv "${LXC_BUILD_DIR}/output/rootfs.squashfs" "rootfs-${FULL_VERSION}.squashfs"
          echo "Renamed files to include full version: ${FULL_VERSION}"
          ls -la incus-*.tar.xz rootfs-*.squashfs

      - name: Change ownership of artifacts
        run: |
          FULL_VERSION="${{ steps.update-yaml.outputs.full_version }}"
          sudo chown runner:runner "incus-${FULL_VERSION}.tar.xz" "rootfs-${FULL_VERSION}.squashfs"

      # Setup SSH agent for secure key management
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.REGISTRY_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -p ${{ secrets.REGISTRY_PORT }} ${{ secrets.REGISTRY_HOST }} >> ~/.ssh/known_hosts

      # Direct scp upload of incus image metadata and rootfs to avoid time-consuming tar & untar
      - name: Upload incus image metadata to registry server
        run: |
          timeout 30m scp -P ${{ secrets.REGISTRY_PORT }} \
            "incus-${{ steps.update-yaml.outputs.full_version }}.tar.xz" \
            ${{ secrets.REGISTRY_USERNAME }}@${{ secrets.REGISTRY_HOST }}:/var/www/lxc/uploads/

      - name: Upload incus image rootfs to registry server
        run: |
          timeout 30m scp -P ${{ secrets.REGISTRY_PORT }} \
            "rootfs-${{ steps.update-yaml.outputs.full_version }}.squashfs" \
            ${{ secrets.REGISTRY_USERNAME }}@${{ secrets.REGISTRY_HOST }}:/var/www/lxc/uploads/

      - name: Process image on server
        uses: appleboy/ssh-action@v1.2.2
        env:
          VERSION: ${{ steps.update-yaml.outputs.full_version }}
          LATEST: ${{ inputs.latest }}
          BLOCKCHAIN: ${{ env.BLOCKCHAIN }}
        with:
          host: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          key: ${{ secrets.REGISTRY_SSH_KEY }}
          port: ${{ secrets.REGISTRY_PORT }}
          envs: VERSION,LATEST,BLOCKCHAIN
          script_path: build/lxc/process-lxc-images.sh
          command_timeout: "30m"

      - name: Upload Incus image artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: crynux-node-incus-image-${{ steps.update-yaml.outputs.full_version }}
          path: |
            incus-${{ steps.update-yaml.outputs.full_version }}.tar.xz
            rootfs-${{ steps.update-yaml.outputs.full_version }}.squashfs
